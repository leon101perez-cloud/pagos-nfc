<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Rápido</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .contenedor {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 280px;
        }
        h2 { color: #333; margin-top: 0; }
        .banco { color: #666; font-size: 18px; margin-bottom: 10px; }
        .clabe { 
            font-size: 22px; 
            font-weight: bold; 
            color: #0056b3; 
            margin-bottom: 20px; 
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
        }
        button:active { background-color: #003d82; }
        #mensaje { color: green; margin-top: 15px; font-weight: bold; height: 20px; }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Transferencia</h2>
        <!-- AQUÍ CAMBIAS EL NOMBRE DEL BANCO -->
        <div class="banco">SANTANDER</div>
        
        <!-- AQUÍ CAMBIAS EL NÚMERO DE CUENTA O CLABE -->
        <div class="clabe" id="cuenta">0335311355378</div>
        
        <button onclick="copiarTexto()">Copiar Número</button>
        <div id="mensaje"></div>
    </div>

    <script>
        function copiarTexto() {
            var numero = document.getElementById("cuenta").innerText;
            navigator.clipboard.writeText(numero).then(function() {
                document.getElementById("mensaje").innerText = "¡Copiado!";
                setTimeout(function() {
                    document.getElementById("mensaje").innerText = "";
                }, 2000);
            });
        }
    </script>

</body>
</html>
