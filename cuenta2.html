<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Rápido</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .contenedor {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 280px;
        }
        .nombre-negocio {
            color: #1a1a1a;
            font-size: 24px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 5px;
        }
        h2 { 
            color: #555; 
            font-size: 16px;
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 20px; 
        }
        .banco { color: #666; font-size: 18px; margin-bottom: 5px; }
        .tipo-cuenta {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .clabe { 
            font-size: 22px; 
            font-weight: bold; 
            color: #0056b3; 
            margin-bottom: 20px; 
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
        }
        button:active { background-color: #003d82; }
        #mensaje { color: green; margin-top: 15px; font-weight: bold; height: 20px; }
    </style>
</head>
<body>

    <div class="contenedor">
             <!-- AQUÍ PONES NEGOCIO REAL -->
        <div class="nombre-negocio">Barberia San Luis</div>
        <h2>Transferencia</h2>
             <!-- AQUÍ PONES BANCO REAL -->
        <div class="banco">BBVA</div>
        <div class="tipo-cuenta">CLABE Interbancaria</div>
        
        <!-- AQUÍ PONES LA CLAVE REAL -->
        <div class="clabe" id="cuenta">23413433278</div>
        
        <button onclick="copiarTexto()">Copiar Número</button>
        <div id="mensaje"></div>
    </div>

    <script>
        function copiarTexto() {
            var numero = document.getElementById("cuenta").innerText;
            navigator.clipboard.writeText(numero).then(function() {
                document.getElementById("mensaje").innerText = "¡Copiado!";
                setTimeout(function() {
                    document.getElementById("mensaje").innerText = "";
                }, 2000);
            });
        }
    </script>

</body>
</html>
